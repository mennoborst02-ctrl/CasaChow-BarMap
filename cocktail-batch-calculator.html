<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barmap - Casa Chow</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#f0ecc8;
  --green:#3a6b47;
  --green-dark:#2c5238;
  --gold:#c8a020;
  --white:#fff;
  --white-muted:rgba(255,255,255,0.72);
  --white-hint:rgba(255,255,255,0.38);
  --border:rgba(255,255,255,0.13);
  --border2:rgba(255,255,255,0.28);
  --surface:rgba(0,0,0,0.15);
  --surface2:rgba(0,0,0,0.22);
  --radius:8px;--radius-lg:14px;
}
body{background:var(--cream);color:var(--green-dark);font-family:DM Sans,sans-serif;font-size:15px;line-height:1.5;min-height:100vh}
.header{background:var(--cream);padding:1.1rem 2rem;display:flex;align-items:center;gap:1.25rem;border-bottom:2px solid rgba(44,82,56,0.18)}
.header-logo{height:54px;width:auto}
.header-text{display:flex;flex-direction:column;gap:1px}
.header-brand{font-family:Bebas Neue,sans-serif;font-size:22px;letter-spacing:.1em;color:var(--green-dark);line-height:1}
.header-sub{font-family:DM Mono,monospace;font-size:10px;color:rgba(44,82,56,0.45);text-transform:uppercase;letter-spacing:.1em}
.layout{display:block;min-height:calc(100vh - 74px);position:relative}
.sidebar{background:var(--cream);padding:1.5rem 0;border-right:2px solid rgba(44,82,56,0.13);overflow-y:auto;position:fixed;top:74px;left:0;width:230px;height:calc(100vh - 74px);z-index:100;transform:translateX(0);transition:transform .25s ease;box-shadow:4px 0 16px rgba(0,0,0,0.12)}
.sidebar.hidden{transform:translateX(-100%)}
.sidebar-overlay{display:none;position:fixed;inset:0;z-index:99;background:rgba(0,0,0,0.25)}
.sidebar-overlay.visible{display:block}
.burger-btn{background:none;border:none;cursor:pointer;padding:.5rem;display:flex;flex-direction:column;gap:5px;justify-content:center;margin-left:auto}
.burger-btn span{display:block;width:22px;height:2px;background:var(--green-dark);border-radius:2px;transition:transform .2s,opacity .2s}
.burger-btn.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger-btn.open span:nth-child(2){opacity:0}
.burger-btn.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.sidebar-label{font-family:Bebas Neue,sans-serif;font-size:12px;letter-spacing:.14em;color:rgba(44,82,56,0.38);padding:0 1.25rem;margin-bottom:.3rem;margin-top:1.25rem}
.sidebar-label:first-child{margin-top:0}
.sidebar-label.current{color:var(--green);opacity:1}
.tab-btn{display:block;width:100%;text-align:left;background:none;border:none;color:rgba(44,82,56,0.55);font-family:DM Sans,sans-serif;font-size:13px;padding:.45rem 1.25rem;cursor:pointer;transition:color .12s,background .12s;border-left:3px solid transparent;line-height:1.3}
.tab-btn:hover{color:var(--green-dark);background:rgba(58,107,71,0.08)}
.tab-btn.active{color:var(--green-dark);border-left-color:var(--green);background:rgba(58,107,71,0.1);font-weight:500}
.tab-btn.placeholder{color:rgba(44,82,56,0.3);cursor:default;font-style:italic}
.tab-btn.placeholder:hover{background:none}
.tab-badge{font-family:DM Mono,monospace;font-size:9px;background:rgba(58,107,71,0.12);color:var(--green);padding:1px 5px;border-radius:3px;margin-left:5px;vertical-align:middle}
.tab-badge.current{background:var(--green);color:var(--white)}
.tab-btn.sidebar-section{font-family:Bebas Neue,sans-serif;font-size:13px;letter-spacing:.1em;color:rgba(44,82,56,0.5);padding:.5rem 1.25rem;margin-top:.9rem;border-left:3px solid transparent}
.tab-btn.sidebar-section:hover{color:var(--green-dark);background:rgba(58,107,71,0.08)}
.tab-btn.sidebar-section.active{color:var(--green-dark);border-left-color:var(--green);background:rgba(58,107,71,0.1)}
.main{background:var(--green);padding:2rem;color:var(--white);min-height:calc(100vh - 74px)}
.main-inner{max-width:660px}
.page-title{font-family:Bebas Neue,sans-serif;font-size:32px;letter-spacing:.06em;color:var(--gold);margin-bottom:3px;text-transform:uppercase}
.page-sub{font-family:DM Mono,monospace;font-size:11px;color:var(--white-hint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:1.75rem}
.scale-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:1.5rem;padding:1.2rem;background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border)}
.scale-field{display:flex;flex-direction:column;gap:5px}
.scale-field label{font-family:DM Mono,monospace;font-size:10px;color:var(--white-hint);text-transform:uppercase;letter-spacing:.08em}
.scale-field input{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--white);font-family:DM Mono,monospace;font-size:15px;font-weight:500;padding:8px 10px;width:100%;outline:none;transition:border-color .15s;-moz-appearance:textfield}
.scale-field input::-webkit-outer-spin-button,.scale-field input::-webkit-inner-spin-button{-webkit-appearance:none}
.scale-field input:focus{border-color:var(--gold)}
.hint-text{font-size:12px;color:var(--white-hint);margin-bottom:1.2rem}
.ing-table{width:100%;border-collapse:collapse;margin-bottom:1.25rem}
.ing-table thead th{font-family:DM Mono,monospace;font-size:10px;color:var(--white-hint);text-transform:uppercase;letter-spacing:.08em;font-weight:400;padding:0 0 10px;text-align:left;border-bottom:1px solid var(--border)}
.ing-table thead th:last-child{text-align:right}
.ing-table tbody tr:last-child td{border-bottom:none}
.ing-table td{padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle;color:var(--white-muted)}
.ing-table td:first-child{color:var(--white)}
.ing-table td:last-child{text-align:right}
.ing-input-wrap{display:flex;align-items:center;gap:5px;justify-content:flex-end}
.ing-input{background:var(--surface2);border:1px solid transparent;border-radius:6px;color:var(--white);font-family:DM Mono,monospace;font-size:14px;font-weight:500;padding:4px 8px;width:90px;text-align:right;outline:none;transition:border-color .15s,background .15s;-moz-appearance:textfield}
.ing-input::-webkit-outer-spin-button,.ing-input::-webkit-inner-spin-button{-webkit-appearance:none}
.ing-input:hover{border-color:var(--border2)}
.ing-input:focus{border-color:var(--gold);background:rgba(200,160,32,0.08)}
.ing-unit{font-size:12px;color:var(--white-hint);font-family:DM Mono,monospace}
.ing-special{color:var(--white-hint);font-style:italic;font-size:13px}
.note-box{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:var(--radius);padding:1rem 1.25rem;font-size:13px;color:var(--white-muted);line-height:1.7}
.juice-section-title{font-family:Bebas Neue,sans-serif;font-size:15px;color:var(--gold);letter-spacing:.1em;margin:1.5rem 0 .75rem;text-transform:uppercase}
.juice-output-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.juice-output{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.85rem 1rem}
.juice-output label{font-family:DM Mono,monospace;font-size:10px;color:var(--white-hint);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:3px}
.juice-output .val{font-family:DM Mono,monospace;font-size:18px;font-weight:600;color:var(--white)}
.water-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:1rem}
.water-label-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.6rem}
.water-label-row span{font-family:DM Mono,monospace;font-size:10px;color:var(--white-hint);text-transform:uppercase;letter-spacing:.08em}
.water-label-row .water-total{color:var(--gold);font-size:13px}
.water-bar{display:grid;grid-template-columns:1fr 1fr;border-radius:6px;overflow:hidden;border:1px solid var(--border2)}
.water-seg{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;padding:.65rem}
.water-seg.a{background:rgba(200,160,32,0.18)}
.water-seg.b{background:rgba(255,255,255,0.05)}
.water-seg .w-lbl{font-family:DM Mono,monospace;font-size:10px;color:var(--white-hint);text-transform:uppercase;text-align:center}
.water-seg .w-amt{font-family:DM Mono,monospace;font-size:15px;font-weight:600;color:var(--white)}
.water-note{font-size:12px;color:var(--white-hint);margin-top:.5rem;line-height:1.5}
.steps-list{list-style:none;counter-reset:steps;margin-top:1rem}
.steps-list li{counter-increment:steps;display:flex;gap:12px;font-size:13px;color:var(--white-muted);line-height:1.6;padding:8px 0;border-bottom:1px solid var(--border)}
.steps-list li:last-child{border-bottom:none}
.steps-list li::before{content:counter(steps);font-family:Bebas Neue,sans-serif;font-size:17px;color:var(--gold);min-width:20px;padding-top:1px}

/* RECIPE CARD - for non-batch cocktails */
.recipe-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem}
.recipe-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.1rem 1.25rem;cursor:pointer;transition:border-color .15s,background .15s}
.recipe-card:hover{border-color:var(--border2);background:rgba(0,0,0,0.22)}
.recipe-card.active{border-color:var(--gold);background:rgba(200,160,32,0.07)}
.recipe-card-name{font-family:Bebas Neue,sans-serif;font-size:17px;letter-spacing:.04em;color:var(--white);margin-bottom:3px}
.recipe-card-meta{font-size:11px;color:var(--white-hint)}
.recipe-detail{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem}
.recipe-detail-title{font-family:Bebas Neue,sans-serif;font-size:26px;letter-spacing:.04em;color:var(--gold);margin-bottom:1rem}
.recipe-ing-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px}
.recipe-ing-row:last-child{border-bottom:none}
.recipe-ing-name{color:var(--white)}
.recipe-ing-amt{color:var(--white-muted);font-family:DM Mono,monospace;font-size:13px}
.recipe-note{margin-top:1rem;font-size:13px;color:var(--white-hint);font-style:italic}

/* PLACEHOLDER */
.placeholder-box{background:var(--surface);border:1px dashed var(--border2);border-radius:var(--radius-lg);padding:2rem;text-align:center;color:var(--white-hint);font-size:14px}
.placeholder-box .ph-icon{font-size:32px;margin-bottom:.75rem;opacity:.4}
.placeholder-box .ph-title{font-family:Bebas Neue,sans-serif;font-size:20px;color:var(--gold);opacity:.5;letter-spacing:.06em;margin-bottom:.5rem}

@media(max-width:700px){
  .main{padding:1.25rem}
  .scale-row{grid-template-columns:1fr 1fr}
  .juice-output-row{grid-template-columns:1fr 1fr}
  .recipe-grid{grid-template-columns:1fr}
  .header{padding:1rem 1.25rem}
  .header-logo{height:42px}
  .sidebar{width:80vw;max-width:300px}
  .tab-btn.sidebar-section{font-size:14px}
}
</style>
</head>
<body>

</div>

let view = "batch"; // "batch" | "juice" | "syrups" | section.id
let batchExpanded = true;
let batchIdx = 0;
let juiceIdx = 0;
let batchScale = 1.0;
let juiceShellWeight = 100;
let activeRecipeIdx = 0;

// ─── SIDEBAR ─────────────────────────────────────────────────────────────────
function buildSidebar(){
  const sb = document.getElementById("sidebar");
  let h = "";

    // Current season
  h += "<button class='tab-btn sidebar-section"+(view==="batch"?" active":"")+"' onclick='showBatch(0)'>Batch 2026</button>";

  // Acids
  const juiceOpen = view==="juice";
  h += '<button class="tab-btn sidebar-section'+(view==="juice"?" active":"")+"' onclick='showJuice(0)'>Super juice</button>";
  if(juiceOpen){
    juices.forEach((j,i)=>{
      h += '<button class="tab-btn sub-tab'+(view==="juice"&&juiceIdx===i?" active":"")+"' onclick='showJuice("+i+")'>"+j.name+"</button>";
    });
  }

  // Syrups
  h += '<button class="tab-btn sidebar-section'+(view==="syrups"?" active":"")+"' onclick='showSyrups()'>Siropen & Infusies</button>";

  // Archive sections
  sections.forEach(sec=>{
    h += "<button class='tab-btn sidebar-section"+(view===sec.id?" active":"")+"' onclick='showSection(\""+sec.id+"\")'>"+ sec.label+"</button>";
  });

  sb.innerHTML = h;
}

// ─── RENDER HELPERS ──────────────────────────────────────────────────────────
function r(n,d=1){return Math.round(n*Math.pow(10,d))/Math.pow(10,d)}
function fmtML(ml){return Math.round(ml)+" ml"}

function showBatch(i){view="batch";batchIdx=i;batchScale=1.0;batchExpanded=true;buildSidebar();renderBatch();closeSidebar()}
function showJuice(i){view="juice";juiceIdx=i;juiceShellWeight=100;buildSidebar();renderJuice();closeSidebar()}
function showSyrups(){view="syrups";buildSidebar();renderSyrups();closeSidebar()}
function showSection(id){view=id;activeRecipeIdx=0;buildSidebar();renderSection(id);closeSidebar()}

// ─── BATCH ───────────────────────────────────────────────────────────────────
function renderBatch(){
  const c=batchCocktails[batchIdx];
  const glasses=r(c.base*batchScale,1);
  const baseTotalMl=c.ingredients.reduce((s,i)=>s+i.ml,0);
  const scaledTotal=r(baseTotalMl*batchScale);
  const ingRows=c.ingredients.map((ing,idx)=>"<tr><td>"+ing.name+"</td><td><div class='ing-input-wrap'><input class='ing-input' type='number' min='0' step='any' value='"+r(ing.ml*batchScale)+"' data-idx='"+idx+"' data-base='"+ing.ml+"' oninput='lockToIng(this)'><span class='ing-unit'>ml</span></div></td></tr>").join("");
  const specialRows=c.specials.map(s=>"<tr><td class='ing-special'>"+s+"</td><td></td></tr>").join("");
  const cards=batchCocktails.map((bc,i)=>"<div class='recipe-card"+(i===batchIdx?" active":"")+"' onclick='selectBatch("+i+")'><div class='recipe-card-name'>"+bc.name+"</div><div class='recipe-card-meta'>"+bc.ingredients.length+" ingredienten"+(bc.tags.length?" &mdash; "+bc.tags.join(", "):"")+  "</div></div>").join("");
  document.getElementById("main").innerHTML=
    "<div class='page-title'>Batch 2026</div>"+
    "<div class='page-sub'>Batch calculator &mdash; basisrecept &times; "+c.base+" glazen</div>"+
    "<div class='recipe-grid'>"+cards+"</div>"+
    "<div class='recipe-detail'>"+
    "<div class='recipe-detail-title'>"+c.name+"</div>"+
    "<div class='scale-row'>"+
      "<div class='scale-field'><label>Aantal glazen</label><input type='number' min='1' step='1' id='inp-glasses' value='"+glasses+"' oninput='scaleByGlasses(this.value)'></div>"+
      "<div class='scale-field'><label>Schaalfactor</label><input type='number' min='0.1' step='0.5' id='inp-factor' value='"+r(batchScale)+"' oninput='scaleByFactor(this.value)'></div>"+
      "<div class='scale-field'><label>Totaal batch</label><input type='number' min='0' step='any' id='inp-total' value='"+scaledTotal+"' oninput='scaleByTotal(this.value,"+baseTotalMl+")'></div>"+
    "</div>"+
    "<p class='hint-text'>Pas ook een ingredient hieronder aan &mdash; de rest past automatisch mee.</p>"+
    "<table class='ing-table'><thead><tr><th>Ingredient</th><th style='text-align:right'>Hoeveelheid</th></tr></thead><tbody>"+ingRows+specialRows+"</tbody></table>"+
    (c.note?"<div class='note-box'>"+c.note+"</div>":"")+
    "</div>";
}

function selectBatch(i){batchIdx=i;batchScale=1.0;renderBatch();scrollToDetail()}

function scaleByGlasses(val){const v=parseFloat(val);if(!isNaN(v)&&v>0){batchScale=v/batchCocktails[batchIdx].base;syncBatch()}}
function scaleByFactor(val){const v=parseFloat(val);if(!isNaN(v)&&v>0){batchScale=v;syncBatch()}}
function scaleByTotal(val,base){const v=parseFloat(val);if(!isNaN(v)&&v>0&&base>0){batchScale=v/base;syncBatch(true)}}
function lockToIng(input){const v=parseFloat(input.value);const b=parseFloat(input.dataset.base);if(!isNaN(v)&&v>0&&b>0){batchScale=v/b;syncBatch(false,parseInt(input.dataset.idx))}}
function syncBatch(skipTotal=false,skipIdx=-1){
  const c=batchCocktails[batchIdx];
  const glasses=r(c.base*batchScale,1);
  const base=c.ingredients.reduce((s,i)=>s+i.ml,0);
  const total=r(base*batchScale);
  const gEl=document.getElementById("inp-glasses");const fEl=document.getElementById("inp-factor");const tEl=document.getElementById("inp-total");
  if(gEl)gEl.value=glasses;if(fEl)fEl.value=r(batchScale);if(!skipTotal&&tEl)tEl.value=total;
  document.querySelectorAll(".ing-input").forEach(inp=>{const idx=parseInt(inp.dataset.idx);if(idx===skipIdx)return;inp.value=r(c.ingredients[idx].ml*batchScale);});
}

// ─── JUICE ───────────────────────────────────────────────────────────────────
function renderJuice(){
  const j=juices[juiceIdx];const w=juiceShellWeight;
  const citric=r(w*j.citricFactor,1);
  const malic=j.malicFactor>0?r(w*j.malicFactor,1):0;
  const waterTotal=Math.round(w*j.waterFactor);
  const water500=Math.min(500,waterTotal);
  const waterRest=Math.max(0,waterTotal-500);
  document.getElementById("main").innerHTML=
    "<div class='page-title'>"+j.name+"</div>"+
    "<div class='page-sub'>Super juice &mdash; vul schilgewicht in</div>"+
    "<div class='scale-row' style='grid-template-columns:1fr'><div class='scale-field'><label>Gewicht schillen (g)</label><input type='number' min='1' step='1' id='inp-shell' value='"+w+"' oninput='updateJuice(this.value)'></div></div>"+
    "<div class='juice-section-title'>Zuren</div>"+
    "<div class='juice-output-row'><div class='juice-output'><label>Citroenzuur</label><div class='val' id='j-citric'>"+citric+" g</div></div>"+(j.malicFactor>0?"<div class='juice-output'><label>Appelzuur (malic acid)</label><div class='val' id='j-malic'>"+malic+" g</div></div>":"")+
    "</div>"+
    "<div class='juice-section-title'>Water</div>"+
    "<div class='water-block'><div class='water-label-row'><span>Verdeling totaal water</span><span class='water-total' id='j-water'>Totaal: "+fmtML(waterTotal)+"</span></div>"+
    "<div class='water-bar'><div class='water-seg a'><span class='w-lbl'>Bij schillen (blender)</span><span class='w-amt' id='j-w-blend'>"+fmtML(water500)+"</span></div><div class='water-seg b'><span class='w-lbl'>Overig water</span><span class='w-amt' id='j-w-rest'>"+fmtML(waterRest)+"</span></div></div>"+
    "<div class='water-note'>Zet 500 ml apart voor de blender. De rest gaat in de maatbeker waar je doorheen zeeft.</div></div>"+
    "<div class='juice-section-title'>Werkwijze</div>"+
    "<ol class='steps-list'>"+j.steps.map(s=>"<li>"+s+"</li>").join("")+"</ol>"+
    "<div class='note-box' style='margin-top:1rem'>"+j.note+"</div>";
}
function updateJuice(val){
  const w=parseFloat(val);if(isNaN(w)||w<=0)return;
  juiceShellWeight=w;const j=juices[juiceIdx];
  const citric=r(w*j.citricFactor,1);const malic=j.malicFactor>0?r(w*j.malicFactor,1):0;
  const waterTotal=Math.round(w*j.waterFactor);const water500=Math.min(500,waterTotal);const waterRest=Math.max(0,waterTotal-500);
  const el=id=>document.getElementById(id);
  if(el("j-citric"))el("j-citric").textContent=citric+" g";
  if(el("j-malic"))el("j-malic").textContent=malic+" g";
  if(el("j-water"))el("j-water").textContent="Totaal: "+fmtML(waterTotal);
  if(el("j-w-blend"))el("j-w-blend").textContent=fmtML(water500);
  if(el("j-w-rest"))el("j-w-rest").textContent=fmtML(waterRest);
}

  {name:"Groene thee vodka",supplies:"700 ml vodka, 4 schepjes groene thee, weckpot",steps:["Vul een grote weckpot met 700 ml vodka.","Voeg 4 schepjes groene thee toe en laat 24 uur staan.","Strain terug in een vodka fles en plak een labelsticker erop."]},
  {name:"Ananas siroop / oleo saccharum",supplies:"Ananas, rietsuiker, kristalsuiker, water, weegschaal, maatbeker, schoenendoos, droogoven",steps:["Snijd de schil van de ananas met een beetje vruchtvlees. Snijd ook de kern eruit.","Voeg schillen en kern toe aan een schoenendoos op een weegschaal.","Lees het gewicht af en vermenigvuldig met 1,25. Zoveel suiker moet er toegevoegd worden (50/50 kristal- en rietsuiker).","Schud voorzichtig zodat de ananas volledig bedekt is met suiker. Dek af.","Sticker de doos met datum, tijd en het gewicht van de suiker. Laat 24 uur staan.","Snijd ondertussen de overige ananas in dunne plakken en droog op 55°C voor 8 uur in de droogoven.","Na 36 uur: haal schillen eruit en weeg de doos. Trek het dooosgewicht (215 g) en de suiker af = gewicht ananasvocht.","Voeg ananasvocht en water (helft van suikergewicht) samen met suikermengsel toe aan een pan op laag vuur. Roer tot opgelost.","Finestrain en vacuumeer per 300 ml. Vergeet niet te stickeren."]},
  {name:"Earl grey thee siroop",supplies:"2200 g heet water, 53 g earl grey thee, suiker, grote maatbeker, zeef",steps:["Doe 2200 g heet water in een grote maatbeker. Voeg 53 g earl grey thee bij.","Laat 13 minuten staan. Zeef alle thee eruit.","Weeg hoeveel gram thee-water je over hebt. Verdubbel dat gewicht aan suiker en voeg toe.","Roer tot de suiker volledig is opgelost. Laat afkoelen.","Vacuumeer per 200 ml. Vergeet niet te stickeren.","Bewaar in de koeling (3-4 weken) of vriezer (oneindig)."]},
  {name:"Espresso komijn siroop",supplies:"300 g verse espresso pucks, 300 g suikerriet, 300 g koffie, 8 g komijn, grote metalen kom, barspoon, weegschaal, pour-over",steps:["Zet dubbele espresso en bewaar de pucks. Weeg 300 g espresso pucks af.","Voeg bij de pucks: 300 g suikerriet en 8 g komijn. Tijdig doorroeren met een barspoon tot siroopachtig. Dek af en laat 24 uur staan.","Na 24 uur voeg je 300 g koffie toe en roer goed door. Schenk alles in de pour-over en laat uitdruppelen.","Schenk nog eens over in een schone pour-over als er nog espresso korrels inzitten.","Vacuumeer per 100 ml in de vriezer. Vergeet niet te stickeren."]},
  {name:"Pumpkin spiked siroop",supplies:"200 g pompoen, 200 g suikerriet, 4 g pumpkin spices, 100 g pompoensap, 100 g vodka, weegschaal, grote metalen kom, spatel",steps:["Snij de pompoen in stukjes en doe 200 g in een ruime metalen kom.","Voeg 200 g suikerriet en 4 g pumpkin spices toe. Roer goed door elkaar. Laat 24 uur afgedekt staan.","Na 24 uur voeg je zowel het pompoensap als de vodka toe. Roer tot suikers opgelost zijn.","Strain en vacuumeer per 500 ml. Vergeet niet te stickeren. Leg fifo in de (kleine) vriezer.","Receptuur is makkelijk te verdubbelen."]},
  {name:"Pandan siroop",supplies:"500 ml suikersiroop, 150 g verse pandan, schoenendoos, grote pan, blender, passeerdoek, weegschaal, maatbeker",steps:["Weeg 150 g verse pandan af per 500 ml suikersiroop. Was de pandan.","Knip de pandan in kleinere stukken en doe de siroop inclusief blaadjes in een grote vacuumzak. Leg in koelkast voor 48 uur.","Na 48 uur: knijp al het siroop wat nog aan de pandan zit eruit.","Kook een ruime pan water en zet een kom met ijswater klaar. Blancheer de pandanbladeren ca. 5 minuten (niet bruin laten worden).","Leg de pandan in het ijswater, haal eruit. Doe per 100 ml suikersiroop 30 g pandan in de blender en blend fijn.","Haal alles door een passeerdoek en vang op in een grote maatbeker.","Vacuumeer per 200/250 ml. Vergeet niet te stickeren.","Bewaar fifo in de vriezer of koeling max 1 week."]},
  {name:"Improved pornstar siroop",supplies:"2,5 kg passievruchtpuree, 2,5 kg mangopuree, 750 g witte chocolade, 7500 g suiker, pan, weegschaal",steps:["Smelt de 750 g witte chocolade au bain-marie.","Doe de passievrucht- en mangopuree in de pan en verwarm.","Als de purees geen suiker bevatten, voeg dan de suiker toe (anders niet).","Als de purees warm zijn, voeg de gesmolten chocolade toe. Roer goed door.","Haal van het vuur en laat afgedekt afkoelen in de grote koeling.","Eenmaal afgekoeld vacuumeer per 1 L fifo in de (kleine) vriezer."]},
  {name:"Stoofpeersiroop",supplies:"500 ml peersiroop, 1 kaneelstokje, 2 steranijs, klein handje jeneverbessen, klein handje kruidnagel, 1 gekneusde citroengras, 1 laurierblad, pan",steps:["Voeg alle specerijen toe aan de peersiroop in een pan.","Verwarm op laag vuur en laat zachtjes sudderen totdat de siroop de smaken heeft opgenomen (ca. 20-30 min). Niet laten koken.","Laat afkoelen en finestrain in een maatbeker.","Vacuumeer en sticker. Bewaar in de koeling of vriezer."]}
];

let activeSyrupIdx = 0;

function renderSyrups(){
  const s = syropen[activeSyrupIdx];
  const cards = syropen.map((sy,i)=>"<div class='recipe-card"+(i===activeSyrupIdx?" active":"")+"' onclick='selectSyrup("+i+")'><div class='recipe-card-name'>"+sy.name+"</div><div class='recipe-card-meta'>"+sy.supplies.split(",").length+" benodigdheden</div></div>").join("");
  const detail = "<div class='recipe-detail'><div class='recipe-detail-title'>"+s.name+"</div>"+
    "<div style='font-family:DM Mono,monospace;font-size:10px;color:var(--white-hint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem'>Benodigdheden</div>"+
    "<div style='font-size:13px;color:var(--white-muted);margin-bottom:1rem;line-height:1.7'>"+s.supplies+"</div>"+
    "<div style='font-family:DM Mono,monospace;font-size:10px;color:var(--white-hint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem'>Bereiding</div>"+
    "<ol class='steps-list'>"+s.steps.map(st=>"<li>"+st+"</li>").join("")+"</ol>"+
    "</div>";
  document.getElementById("main").innerHTML=
    "<div class='page-title'>Siropen & Infusies</div>"+
    "<div class='page-sub'>Recepten & bereidingswijze</div>"+
    "<div class='recipe-grid'>"+cards+"</div>"+detail;
}
function selectSyrup(i){activeSyrupIdx=i;renderSyrups();scrollToDetail()}

// ─── SECTION (archive) ───────────────────────────────────────────────────────
function renderSection(id){
  const sec=sections.find(s=>s.id===id);
  if(!sec)return;
  let cards=sec.cocktails.map((c,i)=>"<div class='recipe-card"+(i===activeRecipeIdx?" active":"")+"'  onclick='selectRecipe(\""+id+"\","+i+")'>  <div class='recipe-card-name'>"+c.name+"</div><div class='recipe-card-meta'>"+c.ingredients.length+" ingrediëten</div></div>").join("");
  const c=sec.cocktails[activeRecipeIdx];
  let detail="<div class='recipe-detail'><div class='recipe-detail-title'>"+c.name+"</div>"+
    c.ingredients.map(i=>"<div class='recipe-ing-row'><span class='recipe-ing-name'>"+i.name+"</span><span class='recipe-ing-amt'>"+i.amt+"</span></div>").join("")+
    (c.note?"<div class='recipe-note'>"+c.note+"</div>":"")+
    "</div>";
  document.getElementById("main").innerHTML=
    "<div class='page-title'>"+sec.label+"</div>"+
    "<div class='page-sub'>"+(id==="extra"?"Losse recepten":"Archief &mdash; individuele cocktails")+"</div>"+
    "<div class='recipe-grid'>"+cards+"</div>"+detail;
}
function selectRecipe(secId,i){activeRecipeIdx=i;renderSection(secId);scrollToDetail()}

// ─── SIDEBAR TOGGLE ──────────────────────────────────────────────────────────
function goHome(){
  view="batch"; batchIdx=0; batchScale=1.0; batchExpanded=true;
  buildSidebar(); renderBatch(); closeSidebar();
}

function scrollToDetail(){
  setTimeout(function(){
    const el = document.querySelector(".recipe-detail");
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
  }, 50);
}

function closeSidebar(){
  const sb = document.getElementById("sidebar");
  const btn = document.getElementById("burger");
  const ov = document.getElementById("overlay");
  if(sb && !sb.classList.contains("hidden")){
    sb.classList.add("hidden");
    btn.classList.remove("open");
    ov.classList.remove("visible");
  }
}

function toggleBatch(){
  if(view==="batch"){
    batchExpanded = false;
    buildSidebar();
  } else {
    batchExpanded = true;
    showBatch(0);
  }
}

function toggleSidebar(){
  const sb = document.getElementById("sidebar");
  const btn = document.getElementById("burger");
  const ov = document.getElementById("overlay");
  sb.classList.toggle("hidden");
  btn.classList.toggle("open");
  ov.classList.toggle("visible");
}

// ─── INIT ────────────────────────────────────────────────────────────────────
// Start with sidebar hidden
buildSidebar();
renderBatch();
document.getElementById("sidebar").classList.add("hidden");
</script>
